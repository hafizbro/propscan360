<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropScan 360 | Admin Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <style>
        :root {
            --bg:    #040914;
            --bg2:   #0A1124;
            --bg3:   #131E3A;
            --cyan:  #00E5FF;
            --cyan-glow: rgba(0,229,255,0.4);
            --muted: #A0ABC0;
            --border: rgba(255,255,255,0.07);
            --danger: #FF4757;
            --success:#2ed573;
            --font-h: 'Outfit', sans-serif;
            --font-b: 'Inter', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font-b); background:var(--bg); color:#fff; min-height:100vh; }
        a { text-decoration:none; color:inherit; }
        ul { list-style:none; }

        /* ---- LOGIN SCREEN ---- */
        #loginScreen {
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background: radial-gradient(ellipse at 30% 20%, rgba(0,229,255,0.07) 0%, transparent 60%);
        }
        .login-card {
            background: rgba(19,30,58,0.6); backdrop-filter:blur(20px);
            border:1px solid rgba(0,229,255,0.2); border-radius:24px;
            padding:3rem; width:100%; max-width:420px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,229,255,0.05);
        }
        .login-logo { display:flex; align-items:center; gap:.75rem; margin-bottom:2rem; font-family:var(--font-h); font-size:1.4rem; font-weight:700; }
        .login-logo img { height:36px; border-radius:50%; }
        .login-logo span { color:var(--cyan); }
        .login-card h2 { font-family:var(--font-h); font-size:1.6rem; margin-bottom:.5rem; }
        .login-card p { color:var(--muted); font-size:.9rem; margin-bottom:2rem; }
        .adm-input-group { position:relative; margin-bottom:1.25rem; }
        .adm-input-group i { position:absolute; left:.9rem; top:50%; transform:translateY(-50%); color:var(--muted); font-size:1.1rem; }
        .adm-input {
            width:100%; padding:.85rem 1rem .85rem 2.6rem;
            background:rgba(255,255,255,0.04); border:1px solid var(--border);
            border-radius:10px; color:#fff; font-family:var(--font-b); font-size:.95rem;
            outline:none; transition:border .3s;
        }
        .adm-input:focus { border-color:var(--cyan); box-shadow:0 0 15px rgba(0,229,255,0.15); }
        .adm-btn {
            width:100%; padding:.9rem; background:linear-gradient(135deg,var(--cyan),#00B8D4);
            color:var(--bg); border:none; border-radius:10px; font-family:var(--font-h);
            font-weight:700; font-size:1rem; cursor:pointer; display:flex; align-items:center;
            justify-content:center; gap:.5rem; transition:all .3s;
            box-shadow:0 0 20px rgba(0,229,255,0.3);
        }
        .adm-btn:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(0,229,255,0.5); }
        .adm-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }
        #loginError { color:var(--danger); font-size:.85rem; margin-top:1rem; text-align:center; display:none; }

        /* ---- DASHBOARD ---- */
        #dashboard { display:none; min-height:100vh; }
        .adm-header {
            position:sticky; top:0; z-index:100;
            background:rgba(4,9,20,0.9); backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border);
            padding:1rem 2rem; display:flex; align-items:center; justify-content:space-between;
        }
        .adm-header-logo { display:flex; align-items:center; gap:.6rem; font-family:var(--font-h); font-size:1.2rem; font-weight:700; }
        .adm-header-logo img { height:30px; border-radius:50%; }
        .adm-header-logo span { color:var(--cyan); }
        .adm-header-right { display:flex; align-items:center; gap:1rem; }
        .adm-user { font-size:.85rem; color:var(--muted); }
        .adm-logout {
            padding:.5rem 1.1rem; background:transparent; border:1px solid var(--border);
            color:var(--muted); border-radius:8px; cursor:pointer; font-family:var(--font-b);
            font-size:.85rem; display:flex; align-items:center; gap:.4rem; transition:all .2s;
        }
        .adm-logout:hover { border-color:var(--danger); color:var(--danger); }

        .adm-main { padding:2.5rem 2rem; max-width:1300px; margin:0 auto; }
        .adm-grid { display:grid; grid-template-columns:400px 1fr; gap:2rem; align-items:start; }

        /* FORM CARD */
        .adm-card {
            background:rgba(10,17,36,0.8); backdrop-filter:blur(12px);
            border:1px solid var(--border); border-radius:20px; padding:2rem;
        }
        .adm-card h3 { font-family:var(--font-h); font-size:1.2rem; margin-bottom:1.5rem; display:flex; align-items:center; gap:.6rem; color:var(--cyan); }
        .form-field { margin-bottom:1.25rem; }
        .form-field label { display:block; font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:.5rem; }
        .form-field .adm-input { padding:.8rem 1rem; }

        /* Toggle */
        .toggle-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
        .toggle-row label { font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
        .toggle { position:relative; width:52px; height:28px; }
        .toggle input { opacity:0; width:0; height:0; }
        .slider {
            position:absolute; inset:0; background:rgba(255,255,255,0.1);
            border-radius:28px; cursor:pointer; transition:.3s;
            border:1px solid var(--border);
        }
        .slider::before {
            content:''; position:absolute; width:20px; height:20px; left:3px; bottom:3px;
            background:var(--muted); border-radius:50%; transition:.3s;
        }
        .toggle input:checked + .slider { background:rgba(0,229,255,0.2); border-color:var(--cyan); }
        .toggle input:checked + .slider::before { transform:translateX(24px); background:var(--cyan); box-shadow:0 0 10px var(--cyan-glow); }
        .status-label { font-size:.9rem; font-weight:600; }
        #statusLabel { color:var(--muted); }
        #statusToggle:checked ~ #statusLabel { color:var(--cyan); }

        /* TABLE CARD */
        .adm-table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        thead th {
            padding:.75rem 1rem; text-align:left; font-size:.75rem;
            text-transform:uppercase; letter-spacing:1px; color:var(--muted);
            border-bottom:1px solid var(--border);
        }
        tbody tr { transition:background .2s; }
        tbody tr:hover { background:rgba(255,255,255,0.03); }
        tbody td { padding:.9rem 1rem; font-size:.88rem; border-bottom:1px solid rgba(255,255,255,0.04); vertical-align:middle; }
        .badge {
            display:inline-block; padding:.25rem .75rem; border-radius:20px;
            font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
        }
        .badge-public  { background:rgba(46,213,115,0.15); color:var(--success); border:1px solid rgba(46,213,115,0.3); }
        .badge-private { background:rgba(255,71,87,0.1);  color:var(--danger);  border:1px solid rgba(255,71,87,0.3); }
        .td-actions { display:flex; gap:.6rem; }
        .tbl-btn {
            padding:.35rem .8rem; border-radius:7px; border:none; font-size:.78rem;
            font-family:var(--font-b); font-weight:600; cursor:pointer; display:flex;
            align-items:center; gap:.3rem; transition:all .2s;
        }
        .tbl-btn-copy   { background:rgba(46,213,115,0.08); color:#2ed573; border:1px solid rgba(46,213,115,0.25); }
        .tbl-btn-copy:hover   { background:rgba(46,213,115,0.18); }
        .tbl-btn-edit   { background:rgba(0,229,255,0.1); color:var(--cyan); border:1px solid rgba(0,229,255,0.2); }
        .tbl-btn-edit:hover   { background:rgba(0,229,255,0.2); }
        .tbl-btn-delete { background:rgba(255,71,87,0.1); color:var(--danger); border:1px solid rgba(255,71,87,0.2); }
        .tbl-btn-delete:hover { background:rgba(255,71,87,0.2); }
        .tbl-btn-toggle { background:rgba(255,255,255,0.05); color:var(--muted); border:1px solid var(--border); }
        .tbl-btn-toggle:hover { border-color:var(--cyan); color:var(--cyan); }
        .empty-row td { text-align:center; color:var(--muted); padding:3rem; }

        /* Toast */
        .adm-toast {
            position:fixed; bottom:2rem; right:2rem; z-index:9999;
            padding:1rem 1.5rem; border-radius:12px; font-size:.9rem; font-weight:500;
            display:flex; align-items:center; gap:.75rem;
            backdrop-filter:blur(16px); opacity:0; transform:translateY(20px);
            transition:all .3s; pointer-events:none; max-width:360px;
        }
        .adm-toast.show { opacity:1; transform:translateY(0); pointer-events:all; }
        .adm-toast.success { background:rgba(46,213,115,0.15); border:1px solid rgba(46,213,115,0.4); color:var(--success); }
        .adm-toast.error   { background:rgba(255,71,87,0.1);  border:1px solid rgba(255,71,87,0.4);  color:var(--danger); }

        @media(max-width:900px) {
            .adm-grid { grid-template-columns:1fr; }
            .adm-main { padding:1.5rem 1rem; }
        }
    </style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">
            <img src="logo.png" alt="Logo">
            PropScan <span>360</span>
        </div>
        <h2>Admin Dashboard</h2>
        <p>Restricted access. Enter your admin credentials.</p>
        <div class="adm-input-group">
            <i class="ph-bold ph-envelope-simple"></i>
            <input type="email" id="adminEmail" class="adm-input" placeholder="Admin Email">
        </div>
        <div class="adm-input-group">
            <i class="ph-bold ph-lock-simple"></i>
            <input type="password" id="adminPassword" class="adm-input" placeholder="Password">
        </div>
        <button class="adm-btn" id="loginBtn">
            <i class="ph-bold ph-sign-in"></i>
            <span id="loginBtnText">Sign In</span>
        </button>
        <p id="loginError"></p>
    </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard">
    <header class="adm-header">
        <div class="adm-header-logo">
            <img src="logo.png" alt="Logo">
            PropScan <span>360</span> &mdash; Admin
        </div>
        <div class="adm-header-right">
            <span class="adm-user" id="adminUserEmail"></span>
            <button class="adm-logout" id="logoutBtn"><i class="ph-bold ph-sign-out"></i> Logout</button>
        </div>
    </header>

    <main class="adm-main">
        <div class="adm-grid">

            <!-- ADD / EDIT FORM -->
            <div class="adm-card">
                <h3><i class="ph-duotone ph-plus-circle"></i> <span id="formTitle">Add New Project</span></h3>
                <input type="hidden" id="editDocId">

                <div class="form-field">
                    <label>Client Name</label>
                    <input type="text" id="fClientName" class="adm-input" placeholder="e.g. Mr. Karim">
                </div>
                <div class="form-field">
                    <label>Project Code (unique)</label>
                    <input type="text" id="fProjectCode" class="adm-input" placeholder="e.g. KARIM-VILLA-01">
                </div>
                <div class="form-field">
                    <label>Kuula Iframe URL</label>
                    <input type="url" id="fIframeUrl" class="adm-input" placeholder="https://kuula.co/share/...">
                </div>

                <div class="toggle-row">
                    <label>Visibility Status</label>
                    <div style="display:flex;align-items:center;gap:.75rem;">
                        <span id="statusLabelText" style="font-size:.85rem;color:var(--muted);">Private</span>
                        <label class="toggle">
                            <input type="checkbox" id="fStatusToggle">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <button class="adm-btn" id="saveProjectBtn">
                    <i class="ph-bold ph-floppy-disk"></i>
                    <span id="saveBtnText">Save Project</span>
                </button>
                <button class="adm-btn" id="cancelEditBtn" style="display:none;margin-top:.75rem;background:transparent;border:1px solid var(--border);color:var(--muted);box-shadow:none;">
                    <i class="ph-bold ph-x"></i> Cancel Edit
                </button>
            </div>

            <!-- PROJECTS TABLE -->
            <div class="adm-card">
                <h3><i class="ph-duotone ph-table"></i> All Projects</h3>
                <div class="adm-table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Client</th>
                                <th>Code</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projectsTableBody">
                            <tr class="empty-row"><td colspan="4">Loading projects...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Toast -->
<div class="adm-toast" id="admToast">
    <i class="ph-bold" id="admToastIcon"></i>
    <span id="admToastMsg"></span>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ============================================================
// PASTE YOUR FIREBASE CONFIG HERE (same as index.html)
// ============================================================
const firebaseConfig = {
    apiKey:            "AIzaSyAbe0uOSfS5c2pZRMSaeD6bBStQNxRyIWs",
    authDomain:        "propscan360-c4c38.firebaseapp.com",
    projectId:         "propscan360-c4c38",
    storageBucket:     "propscan360-c4c38.firebasestorage.app",
    messagingSenderId: "279591272544",
    appId:             "1:279591272544:web:fcd22bee22f57fc5f8c305"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ============================================================
// YOUR DEPLOYED SITE URL — update this before going live
// ============================================================
const SITE_BASE_URL = window.location.origin; // Auto-detects current domain

// --- Toast ---
let toastTimer;
function showToast(msg, type='success') {
    clearTimeout(toastTimer);
    const t = document.getElementById('admToast');
    t.className = 'adm-toast ' + type + ' show';
    document.getElementById('admToastIcon').className = type === 'success'
        ? 'ph-bold ph-check-circle' : 'ph-bold ph-warning-circle';
    document.getElementById('admToastMsg').textContent = msg;
    toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

// --- Auth State ---
auth.onAuthStateChanged(user => {
    if (user) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display   = 'block';
        document.getElementById('adminUserEmail').textContent = user.email;
        listenToProjects();
    } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboard').style.display   = 'none';
    }
});

// --- Login ---
document.getElementById('loginBtn').addEventListener('click', async () => {
    const email    = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const errEl    = document.getElementById('loginError');
    const btnText  = document.getElementById('loginBtnText');
    errEl.style.display = 'none';
    document.getElementById('loginBtn').disabled = true;
    btnText.textContent = 'Signing in...';
    try {
        await auth.signInWithEmailAndPassword(email, password);
    } catch(e) {
        errEl.textContent = 'Invalid email or password.';
        errEl.style.display = 'block';
        document.getElementById('loginBtn').disabled = false;
        btnText.textContent = 'Sign In';
    }
});

// --- Logout ---
document.getElementById('logoutBtn').addEventListener('click', () => auth.signOut());

// --- Status Toggle Label ---
const fStatusToggle = document.getElementById('fStatusToggle');
const statusLabelText = document.getElementById('statusLabelText');
fStatusToggle.addEventListener('change', () => {
    statusLabelText.textContent = fStatusToggle.checked ? 'Public' : 'Private';
    statusLabelText.style.color = fStatusToggle.checked ? 'var(--cyan)' : 'var(--muted)';
});

// --- Real-time Listener ---
let unsubscribe = null;
function listenToProjects() {
    if (unsubscribe) unsubscribe();
    unsubscribe = db.collection('projects').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        renderTable(snapshot.docs);
    }, err => {
        showToast('Failed to load projects.', 'error');
    });
}

function renderTable(docs) {
    const tbody = document.getElementById('projectsTableBody');
    if (docs.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No projects yet. Add one!</td></tr>';
        return;
    }
    tbody.innerHTML = docs.map(doc => {
        const d = doc.data();
        const isPublic = d.status === 'Public';
        return `<tr>
            <td><strong>${escHtml(d.clientName)}</strong></td>
            <td><code style="background:rgba(0,229,255,0.08);padding:.2rem .5rem;border-radius:5px;font-size:.8rem;color:var(--cyan);">${escHtml(d.projectCode)}</code></td>
            <td><span class="badge ${isPublic ? 'badge-public' : 'badge-private'}">${isPublic ? 'Public' : 'Private'}</span></td>
            <td><div class="td-actions">
                <button class="tbl-btn tbl-btn-copy" onclick="copyDirectLink('${escHtml(d.projectCode)}')"><i class="ph-bold ph-link"></i> Copy Link</button>
                <button class="tbl-btn tbl-btn-edit" onclick="editProject('${doc.id}')"><i class="ph-bold ph-pencil-simple"></i> Edit</button>
                <button class="tbl-btn tbl-btn-toggle" onclick="toggleStatus('${doc.id}','${d.status}')"><i class="ph-bold ph-eye${isPublic ? '-slash' : ''}"></i> ${isPublic ? 'Hide' : 'Publish'}</button>
                <button class="tbl-btn tbl-btn-delete" onclick="deleteProject('${doc.id}')"><i class="ph-bold ph-trash"></i> Delete</button>
            </div></td>
        </tr>`;
    }).join('');
}

function escHtml(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// --- Copy Direct Link ---
window.copyDirectLink = async function(code) {
    const url = `${SITE_BASE_URL}/?project=${encodeURIComponent(code)}`;
    try {
        await navigator.clipboard.writeText(url);
        showToast(`Link copied! \n${url}`, 'success');
    } catch(e) {
        // Fallback for older browsers
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Link copied to clipboard!', 'success');
    }
};

// --- Save / Update ---
document.getElementById('saveProjectBtn').addEventListener('click', async () => {
    const docId    = document.getElementById('editDocId').value;
    const name     = document.getElementById('fClientName').value.trim();
    const code     = document.getElementById('fProjectCode').value.trim().toUpperCase();
    const iframe   = document.getElementById('fIframeUrl').value.trim();
    const isPublic = document.getElementById('fStatusToggle').checked;

    if (!name || !code || !iframe) { showToast('All fields are required.', 'error'); return; }

    const btn = document.getElementById('saveProjectBtn');
    btn.disabled = true;
    document.getElementById('saveBtnText').textContent = 'Saving...';

    const payload = {
        clientName:  name,
        projectCode: code,
        iframeUrl:   iframe,
        status:      isPublic ? 'Public' : 'Private',
        updatedAt:   firebase.firestore.FieldValue.serverTimestamp()
    };

    try {
        if (docId) {
            await db.collection('projects').doc(docId).update(payload);
            showToast('Project updated successfully!', 'success');
        } else {
            payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await db.collection('projects').add(payload);
            showToast('Project added successfully!', 'success');
        }
        resetForm();
    } catch(e) {
        showToast('Error saving: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        document.getElementById('saveBtnText').textContent = 'Save Project';
    }
});

// --- Edit ---
window.editProject = async (docId) => {
    const doc = await db.collection('projects').doc(docId).get();
    const d   = doc.data();
    document.getElementById('editDocId').value       = docId;
    document.getElementById('fClientName').value     = d.clientName;
    document.getElementById('fProjectCode').value    = d.projectCode;
    document.getElementById('fIframeUrl').value      = d.iframeUrl;
    fStatusToggle.checked = (d.status === 'Public');
    fStatusToggle.dispatchEvent(new Event('change'));
    document.getElementById('formTitle').textContent = 'Edit Project';
    document.getElementById('cancelEditBtn').style.display = 'flex';
    document.getElementById('fClientName').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

// --- Toggle Status ---
window.toggleStatus = async (docId, current) => {
    const newStatus = current === 'Public' ? 'Private' : 'Public';
    try {
        await db.collection('projects').doc(docId).update({ status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        showToast(`Project set to ${newStatus}.`, 'success');
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
};

// --- Delete ---
window.deleteProject = async (docId) => {
    if (!confirm('Delete this project? This cannot be undone.')) return;
    try {
        await db.collection('projects').doc(docId).delete();
        showToast('Project deleted.', 'success');
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
};

// --- Cancel Edit ---
document.getElementById('cancelEditBtn').addEventListener('click', resetForm);
function resetForm() {
    document.getElementById('editDocId').value    = '';
    document.getElementById('fClientName').value  = '';
    document.getElementById('fProjectCode').value = '';
    document.getElementById('fIframeUrl').value   = '';
    fStatusToggle.checked = false;
    fStatusToggle.dispatchEvent(new Event('change'));
    document.getElementById('formTitle').textContent = 'Add New Project';
    document.getElementById('cancelEditBtn').style.display = 'none';
}
</script>
</body>
</html>
